kind = "web"
previewPath = "/"
title = "Yuniko"
version = "1.0.0"
id = "artifacts/yuniko"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21753

[services.development]
run = "pnpm --filter @workspace/yuniko run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yuniko", "run", "build" ]
publicDir = "artifacts/yuniko/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21753"
BASE_PATH = "/"
