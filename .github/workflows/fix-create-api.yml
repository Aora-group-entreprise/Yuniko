name: Fix create API client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch create page
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/yuniko/src/pages/create.tsx')
          s = p.read_text()
          if 'import { apiJson } from "@/lib/api";' not in s:
              s = s.replace('import { useAuth } from "@/lib/auth-context";\n', 'import { useAuth } from "@/lib/auth-context";\nimport { apiJson } from "@/lib/api";\n')
          old_story = '''const r = await fetch("https://yuniko-api.lafatriniainaallane.workers.dev/api/stories", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ mediaUrl: selectedMedia, caption: caption.trim() }),
        });
        const d = await r.json() as { story?: any; error?: string };
        if (!r.ok) { setError(d.error ?? "Failed to post story"); return; }'''
          new_story = '''await apiJson<{ story?: unknown }>("/stories", {
          method: "POST",
          body: JSON.stringify({ mediaUrl: selectedMedia, caption: caption.trim() }),
        });'''
          old_post = '''const r = await fetch("https://yuniko-api.lafatriniainaallane.workers.dev/api/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({
            caption: caption.trim(),
            mediaUrl: selectedMedia,
            location: locationText.trim() || undefined,
            hashtags: hashtags.trim() || undefined,
            isWorldFeed,
          }),
        });
        const d = await r.json() as { post?: any; error?: string };
        if (!r.ok) { setError(d.error ?? "Failed to post"); return; }'''
          new_post = '''await apiJson<{ post?: unknown }>("/posts", {
          method: "POST",
          body: JSON.stringify({
            caption: caption.trim(),
            mediaUrl: selectedMedia,
            location: locationText.trim() || undefined,
            hashtags: hashtags.trim() || undefined,
            isWorldFeed,
          }),
        });'''
          if old_story not in s or old_post not in s:
              raise SystemExit('Expected create API blocks were not found; refusing to modify file')
          s = s.replace(old_story, new_story).replace(old_post, new_post)
          s = s.replace('''    } catch {
      setError("Network error. Please try again.");
    }''', '''    } catch (err) {
      console.error("Create post/story failed", err);
      setError(err instanceof Error ? err.message : "Unable to publish. Please try again.");
    }''', 1)
          p.write_text(s)
      - name: Verify patch
        run: |
          grep -q 'import { apiJson } from "@/lib/api";' artifacts/yuniko/src/pages/create.tsx
          ! grep -q 'yuniko-api.lafatriniainaallane.workers.dev/api/posts' artifacts/yuniko/src/pages/create.tsx
          ! grep -q 'yuniko-api.lafatriniainaallane.workers.dev/api/stories' artifacts/yuniko/src/pages/create.tsx
      - name: Commit and remove fixer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/yuniko/src/pages/create.tsx .github/workflows/fix-create-api.yml
          git commit -m 'fix(create): use shared API client for posts and stories'
          git rm .github/workflows/fix-create-api.yml
          git commit -m 'chore: remove temporary create API fixer'
          git push
