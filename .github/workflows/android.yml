name: Build Yuniko Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Yuniko web app
        run: pnpm --filter @workspace/yuniko build

      - name: Install Capacitor in isolated workspace
        run: |
          mkdir -p .capacitor
          npm init -y --prefix .capacitor
          npm install --prefix .capacitor --no-save @capacitor/cli@8.5.2
          npm install --no-save --package-lock=false --ignore-scripts @capacitor/core@8.5.2 @capacitor/android@8.5.2

      - name: Generate Capacitor Android project
        run: |
          rm -rf android
          ./.capacitor/node_modules/.bin/cap add android

      - name: Sync web assets into Android
        run: ./.capacitor/node_modules/.bin/cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuniko-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
