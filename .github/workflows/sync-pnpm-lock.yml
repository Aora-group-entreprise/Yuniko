name: Sync pnpm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
          else
            git add pnpm-lock.yaml
            git commit -m "chore: synchronize pnpm lockfile"
            git push
          fi
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/sync-pnpm-lock.yml
          git commit -m "chore: remove temporary lockfile workflow"
          git push
