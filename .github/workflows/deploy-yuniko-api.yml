name: Deploy Yuniko API

on:
  push:
    branches:
      - main
      - fix/production-api-connection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-yuniko-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        run: npm install --global pnpm@10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Prepare production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const { writeFileSync } = require("node:fs");
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const storageKey = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is not configured");
          if (!storageKey) throw new Error("SUPABASE_SERVICE_ROLE_KEY is not configured");
          const sessionSecret = createHash("sha256")
            .update("yuniko-production-jwt-v1:")
            .update(token)
            .digest("hex");
          const secrets = {
            SESSION_SECRET: sessionSecret,
            SUPABASE_SERVICE_ROLE_KEY: storageKey,
          };
          writeFileSync("/tmp/yuniko-secrets.json", JSON.stringify(secrets));
          NODE

      - name: Deploy Yuniko API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --secrets-file /tmp/yuniko-secrets.json

      - name: Verify Worker health
        run: |
          status=$(curl --silent --show-error --retry 5 --retry-delay 2 \
            --output /tmp/yuniko-health.json --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            https://yuniko-api.lafatriniainaallane.workers.dev/api/health)
          cat /tmp/yuniko-health.json
          test "$status" = "200"

      - name: Verify database health
        run: |
          status=$(curl --silent --show-error --output /tmp/yuniko-db-health.json --write-out '%{http_code}' \
            --header 'Accept: application/json' \
            https://yuniko-api.lafatriniainaallane.workers.dev/api/health/db)
          cat /tmp/yuniko-db-health.json
          test "$status" = "200"

      - name: Verify frontend CORS preflight
        run: |
          curl --fail --silent --show-error \
            --request OPTIONS \
            --header 'Origin: https://yuniko-19d.pages.dev' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type' \
            https://yuniko-api.lafatriniainaallane.workers.dev/api/posts
