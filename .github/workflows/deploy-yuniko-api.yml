name: Deploy Yuniko API

on:
  push:
    branches:
      - main
      - fix/production-api-connection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-yuniko-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        run: npm install --global pnpm@10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Yuniko API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
